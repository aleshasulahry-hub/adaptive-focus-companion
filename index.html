<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFC | Energy Check-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">AFC</div>
        <nav class="nav">
            <a href="index.html" class="active">Check-In</a>
            <a href="dashboard.html">Session</a>
            <a href="insights.html">Insights</a>
            <a href="about.html">About</a>
    </nav>
    <button id="themeToggle" class="theme-btn">Toggle Theme</button>
  </header>

    <main class="page-shell">
    <section class="panel panel-checkin">
      <h1>AFC</h1>
      <p class="eyebrow">QUICK ENERGY CHECK-IN</p>

      <div class="content-block">
        <h2>How are you feeling right now?</h2>

       <div class="slider-group">
          <div class="slider-head">
            <label for="focus">Focus</label>
            <span id="focusValue">3</span>
          </div>
          <input type="range" id="focus" min="1" max="5" value="3">
          <p class="slider-note">How well can you concentrate right now?</p>
        </div>  

         <div class="slider-group">
          <div class="slider-head">
            <label for="stress">Stress</label>
            <span id="stressValue">3</span>
          </div>
          <input type="range" id="stress" min="1" max="5" value="3">
          <p class="slider-note">How overwhelmed or tense do you feel?</p>
        </div>

        <div class="slider-group">
          <div class="slider-head">
            <label for="alertness">Alertness</label>
            <span id="alertnessValue">3</span>
          </div>
          <input type="range" id="alertness" min="1" max="5" value="3">
          <p class="slider-note">How awake and mentally sharp do you feel?</p>
        </div>
      </div>
